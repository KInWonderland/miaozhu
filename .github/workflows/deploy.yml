name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同一分支只保留一个正在进行的部署；新的提交会等待当前部署结束，避免服务版本倒退。
concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/kinwonderland/miaozhu-backend
  FRONTEND_IMAGE: ghcr.io/kinwonderland/miaozhu-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Pull images and restart services on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            cd /home/ubuntu/env
            git pull
            cd /home/ubuntu/miaozhu
            git pull
            IMAGE_TAG="${{ github.sha }}" docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG="${{ github.sha }}" docker compose -f docker-compose.prod.yml up -d --remove-orphans
            IMAGE_TAG="${{ github.sha }}" docker compose -f docker-compose.prod.yml ps

      - name: Notify Telegram about deployment
        if: success()
        env:
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_SERVER: ${{ secrets.SERVER_HOST }}
        run: |
          telegram_text=$(printf '✅ 部署成功\n仓库：%s\n提交：%s\n服务器：%s' \
            "$DEPLOY_REPOSITORY" "$DEPLOY_SHA" "$DEPLOY_SERVER")
          curl --fail --silent --show-error --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=${telegram_text}"
