name: Deploy to Tencent Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同一分支只保留一个正在进行的部署；新的提交会等待当前部署结束，避免服务版本倒退。
concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Update source, build, and restart services on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            cd /home/ubuntu/env
            git pull --ff-only
            test -f /home/ubuntu/env/miaozhu/.env
            docker network inspect public-gateway >/dev/null 2>&1 || \
              docker network create public-gateway || \
              docker network inspect public-gateway >/dev/null 2>&1
            cd /home/ubuntu/miaozhu
            git pull --ff-only
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml ps

      # ================== 发送 Telegram 通知 ==================
      - name: Send Telegram Notification
        if: always() # 无论前面打包是成功还是失败，都一定会发送通知
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown  # 使用 Markdown 格式美化排版
          message: |
            *📢 GitHub Actions 运行报告*

            *构建状态*：${{ job.status == 'success' && '✅ 打包成功' || '❌ 打包失败' }}
            *项目名称*：`${{ github.repository }}`
            *触发分支*：`${{ github.ref_name }}`
            *最新提交*：_${{ github.event.head_commit.message }}_

            [点击查看完整构建日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
