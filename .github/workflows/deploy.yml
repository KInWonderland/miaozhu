name: Deploy to Tencent Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同一分支只保留一个正在进行的部署；新的提交会等待当前部署结束，避免服务版本倒退。
concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Update source, build, and restart services on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            cd /home/ubuntu/env
            git pull --ff-only
            cd /home/ubuntu/miaozhu
            git pull --ff-only
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml ps

      - name: Notify Telegram about deployment
        if: success()
        env:
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_SERVER: ${{ secrets.SERVER_HOST }}
        run: |
          telegram_text=$(printf '✅ 部署成功\n仓库：%s\n提交：%s\n服务器：%s' \
            "$DEPLOY_REPOSITORY" "$DEPLOY_SHA" "$DEPLOY_SERVER")
          curl --fail --silent --show-error --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=${telegram_text}"
