services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      # Read the bind-mounted file at runtime instead of the initial env_file copy.
      MIAOZHU_ENV_FILE: /app-config/.env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data        # 持久化数据库和导出文件
      # Mount the directory (not only the file) so atomic editor saves are visible.
      - ./backend:/app-config:ro
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # 前端镜像内使用 Nginx，实际监听 80；主机仍通过 5173 访问。
      - "5173:80"
    depends_on:
      - backend
    restart: always
