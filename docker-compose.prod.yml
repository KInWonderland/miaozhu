name: miaozhu

# 生产环境在腾讯云服务器上从最新源码构建镜像。
# GitHub Actions 通过 SSH 执行：docker compose -f docker-compose.prod.yml up -d --build
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 腾讯云内网镜像，加速 Debian 软件包与 PyPI 依赖下载。
        DEBIAN_MIRROR: mirrors.tencentyun.com
        PIP_INDEX_URL: http://mirrors.tencentyun.com/pypi/simple/
        PIP_TRUSTED_HOST: mirrors.tencentyun.com
        # 可替换为自建制品库；默认使用国内 Playwright 下载镜像。
        PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.npmmirror.com/binaries/playwright
    image: miaozhu-backend:local
    env_file:
      # 此文件只保存在服务器，不能提交到 Git。
      - /home/ubuntu/env/miaozhu/.env
    volumes:
      # SQLite 数据库和导出文件必须持久化，升级镜像不会清除它们。
      - /var/lib/miaozhuData:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: miaozhu-frontend:local
    ports:
      # 公网 80 端口由服务器现有的 Nginx/Caddy 占用；仅向本机反向代理开放。
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
