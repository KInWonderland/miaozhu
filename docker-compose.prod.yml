name: miaozhu

# 生产环境在腾讯云服务器上从最新源码构建镜像。
# GitHub Actions 通过 SSH 执行：docker compose -f docker-compose.prod.yml up -d --build
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: miaozhu-backend:local
    env_file:
      # 此文件只保存在服务器，不能提交到 Git。
      - /home/ubuntu/env/miaozhu/.env
    volumes:
      # SQLite 数据库和导出文件必须持久化，升级镜像不会清除它们。
      - /var/lib/miaozhuData:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: miaozhu-frontend:local
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
