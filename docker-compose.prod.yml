name: miaozhu

# 生产环境只拉取 GitHub Actions 已构建的镜像，不在服务器上构建源码。
# 启动时使用：IMAGE_TAG=<Git commit SHA> docker compose -f docker-compose.prod.yml up -d
services:
  backend:
    image: ghcr.io/kinwonderland/miaozhu-backend:${IMAGE_TAG:?请设置 IMAGE_TAG}
    env_file:
      # 此文件只保存在服务器，不能提交到 Git。
      - /home/ubuntu/env/miaozhu/.env
    volumes:
      # SQLite 数据库和导出文件必须持久化，升级镜像不会清除它们。
      - /var/lib/miaozhuData:/app/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/kinwonderland/miaozhu-frontend:${IMAGE_TAG:?请设置 IMAGE_TAG}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
